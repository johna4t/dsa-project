name: Frontend CI

on:
  push:
    branches: [ "development", "main" ]
    paths:
      - "dsa-client/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [ "development", "main" ]
    paths:
      - "dsa-client/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsa-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # match your local
          cache: npm
          cache-dependency-path: dsa-client/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present -- --watch=false
      - name: Build
        run: npm run build