name: Backend CI

on:
  push:
    branches: [ "development", "main" ]
    paths:
      - "dsa-service/**"
      - "pom.xml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "development", "main" ]
    paths:
      - "dsa-service/**"
      - "pom.xml"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsa-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # change if you’re on 17 etc.
          cache: maven
      - name: Run tests
        run: mvnw -B test
