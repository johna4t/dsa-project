name: PR Validation

on:
  pull_request:
    branches: [ "development", "main" ]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'dsa-service/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/deploy-backend.yml'
            frontend:
              - 'dsa-client/**'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/deploy-frontend.yml'
            docker:
              - 'dsa-service/**'
              - '.github/workflows/docker-build.yml'
              - 'dsa-service/Dockerfile'

  backend-required:
    name: Backend Required Check
    runs-on: ubuntu-latest
    needs: detect-changes

    defaults:
      run:
        working-directory: dsa-service
        shell: bash

    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Skip backend validation
        if: needs.detect-changes.outputs.backend != 'true'
        run: echo "No backend changes detected."

      - uses: actions/setup-java@v4
        if: needs.detect-changes.outputs.backend == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Docker info
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          docker version
          docker info

      - name: Make mvnw executable
        if: needs.detect-changes.outputs.backend == 'true'
        run: chmod +x ./mvnw

      - name: Run backend tests
        if: needs.detect-changes.outputs.backend == 'true'
        run: ./mvnw -B -ntp test

      - name: Upload surefire reports on failure
        if: failure() && needs.detect-changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: dsa-service/target/surefire-reports

  docker-required:
    name: Docker Required Check
    runs-on: ubuntu-latest
    needs: detect-changes

    defaults:
      run:
        working-directory: dsa-service

    steps:
      - uses: actions/checkout@v4

      - name: Skip docker validation
        if: needs.detect-changes.outputs.docker != 'true'
        run: echo "No backend/docker changes detected."

      - name: Build Docker image
        if: needs.detect-changes.outputs.docker == 'true'
        run: docker build -t dsa-service:ci .

  frontend-required:
    name: Frontend Required Check
    runs-on: ubuntu-latest
    needs: detect-changes

    defaults:
      run:
        working-directory: dsa-client

    steps:
      - uses: actions/checkout@v4

      - name: Skip frontend validation
        if: needs.detect-changes.outputs.frontend != 'true'
        run: echo "No frontend changes detected."

      - uses: actions/setup-node@v4
        if: needs.detect-changes.outputs.frontend == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dsa-client/package-lock.json

      - name: Install
        if: needs.detect-changes.outputs.frontend == 'true'
        run: npm ci

      - name: Lint
        if: needs.detect-changes.outputs.frontend == 'true'
        run: npm run lint --if-present

      - name: Test
        if: needs.detect-changes.outputs.frontend == 'true'
        run: npm test --if-present -- --watch=false --browsers=ChromeHeadless

      - name: Build
        if: needs.detect-changes.outputs.frontend == 'true'
        run: npm run build