services:
  db:
    image: postgres:16
    container_name: dsa-postgres
    environment:
      POSTGRES_DB: dsa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    # volumes:
      # - dsa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dsa"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: dsa-service
    container_name: dsa-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: localdev
      DB_URL: jdbc:postgresql://dsa-postgres:5432/dsa
      DB_USERNAME: postgres
      DB_PASSWORD: admin
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "8080:8080"
      - "5005:5005"

# Allow Postgres DB to refresh each time
# volumes:
  # dsa_pgdata: