spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://dsa-postgres:5432/dsa}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

sharedsystemshome:
  dsa:
    secret-key: 5f1bc86eee84322cd47a4ef9208f4c8bfca690b358ba0e980a135f9cef72fe7a

management:
  endpoints:
    web:
      exposure:
        include: health

security:
  filters:
    origin-verification:
      # disabled for local deployment
      enabled: ${SECURITY_FILTERS_ORIGIN_VERIFICATION_ENABLED:false}