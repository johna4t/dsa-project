spring:
  test:
    database:
      replace: none  # prevents Spring from swapping in H2 automatically

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  error:
    include-message: always

logging:
  level:
    com.zaxxer.hikari: INFO